# Refreshes the league data from ESPN and the ice sheet, rebuilds the site, and publishes it to GitHub Pages.
name: Build and deploy

on:
  # Times are UTC (ET is UTC-4 until early November, then UTC-5). Minute 7 avoids GitHub's busy top of the hour.
  schedule:
    - cron: '7 11 * * *'      # every day, ~7am ET (after Monday night's game on Tuesdays)
    - cron: '7 23 * * *'      # every day, ~7pm ET (picks up ices logged during the day)
    - cron: '7 13-23 * * 0'   # Sundays hourly, London games through the late afternoon slate
    - cron: '7 0-4 * * 1'     # Sunday night game (early Monday UTC)
    - cron: '7 0-4 * * 5'     # Thursday night game
    - cron: '7 0-4 * * 2'     # Monday night game
    - cron: '7 17-23 * * 6'   # Saturday games late in the season
  workflow_dispatch:       # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch data
        run: node fetch.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
          ICE_SHEET_ID: ${{ vars.ICE_SHEET_ID }}
          ICE_SHEET_TAB: ${{ vars.ICE_SHEET_TAB }}
      - name: Build site
        run: node build.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
