# Refreshes the league data from ESPN and the ice sheet, rebuilds the site, and publishes it to the
# gh-pages branch, which GitHub Pages serves.
#
# On-time refreshes are started by cron-job.org through the API (workflow_dispatch), because GitHub's
# own scheduler can start runs hours late. Schedule (America/New_York): daily 7:00 and 19:00, and
# Sundays hourly 8:00-23:00. See README.md, "Refresh schedule".
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hours:
        description: Keep refreshing on the hour for this many hours (0 = refresh once)
        default: '0'
  schedule:
    # Safety net only, in case cron-job.org is down. GitHub may run these late; that just refreshes again.
    - cron: '15 12 * * *'
    - cron: '15 0 * * *'

permissions:
  contents: write

# Requests that arrive close together queue up rather than cancel each other.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh
        run: bash scripts/refresh.sh
        env:
          HOURS: ${{ github.event.inputs.hours || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
          ICE_SHEET_ID: ${{ vars.ICE_SHEET_ID }}
          ICE_SHEET_TAB: ${{ vars.ICE_SHEET_TAB }}
